services:
  db:
    image: postgres:15-alpine
    container_name: vocab-trainer-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: vocab_trainer
    # Commented out for security, but uncomment if you need to access the database from the host
    # ports:
    #   - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vocab_trainer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocab-trainer-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/vocab_trainer
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # Perform migrations, populate and launch the PRODUCTION build
    command: sh -c "npm run db:push && npm run db:seed && npm run start"

volumes:
  postgres_data: