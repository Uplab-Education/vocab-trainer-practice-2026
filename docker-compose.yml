services:
  db:
    image: postgres:15-alpine
    container_name: vocab-trainer-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: vocab_trainer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocab-trainer-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/vocab_trainer
      NODE_ENV: production
    depends_on:
      - db

volumes:
  postgres_data: